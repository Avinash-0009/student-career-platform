grafana:
  enabled: true

  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  service:
    type: ClusterIP

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi


alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: studentcareer.alerts@gmail.com
      smtp_auth_username: studentcareer.alerts@gmail.com
      smtp_require_tls: true

    inhibit_rules:
      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info

      - equal:
          - namespace
          - alertname
        source_matchers:
          - severity = warning
        target_matchers:
          - severity = info

      - equal:
          - namespace
        source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info

      - target_matchers:
          - alertname = InfoInhibitor

    route:
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"

      routes:
        - matchers:
            - alertname =~ "BackendDown|PostgreSQLDown|NodeNotReady|HighNodeCPU|BackendPodRestarting|BackendHPAMaxReplicas"
          receiver: "student-career-email"

        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: "null"

      - name: "student-career-email"
        email_configs:
          - to: 2005avinashjogi@gmail.com
            auth_username: studentcareer.alerts@gmail.com
            auth_password_file: /etc/alertmanager/secrets/student-career-smtp/smtp-password
            send_resolved: true

  alertmanagerSpec:
    secrets:
      - student-career-smtp

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi