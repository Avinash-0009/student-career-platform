name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: career_user
          POSTGRES_PASSWORD: career_password
          POSTGRES_DB: career_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career_user -d career_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_USER: career_user
          DB_PASSWORD: career_password
          DB_NAME: career_platform
          DB_PORT: 5432
          JWT_SECRET: ci-test-secret
        run: go test ./...

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend
        working-directory: frontend
        run: npm run build
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  

  docker-security:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - sonar

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t career-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t career-frontend:${{ github.sha }} \
            ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: career-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: career-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::451867464323:role/GitHubActions-ECR-StudentCareer
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag career-backend:${{ github.sha }} \
            $REGISTRY/student-career-backend:${{ github.sha }}

          docker tag career-frontend:${{ github.sha }} \
            $REGISTRY/student-career-frontend:${{ github.sha }}

      - name: Push Docker images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/student-career-backend:${{ github.sha }}
          docker push $REGISTRY/student-career-frontend:${{ github.sha }}
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - docker-security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::451867464323:role/GitHubActions-EKS-Deploy-StudentCareer
          aws-region: ap-south-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name student-career-eks

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=451867464323.dkr.ecr.ap-south-1.amazonaws.com/student-career-backend:${{ github.sha }} \
            -n student-career

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=451867464323.dkr.ecr.ap-south-1.amazonaws.com/student-career-frontend:${{ github.sha }} \
            -n student-career

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            -n student-career \
            --timeout=180s

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n student-career \
            --timeout=180s
